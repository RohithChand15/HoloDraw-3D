<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="holo" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#030712"/>
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="url(#holo)" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Hologram Isometric Cube -->
  <g filter="url(#glow)">
    <polygon points="32,12 50,22 32,32 14,22" fill="#00f5ff" fill-opacity="0.25" stroke="#00f5ff" stroke-width="1.5"/>
    <polygon points="14,22 32,32 32,52 14,42" fill="#00c8e6" fill-opacity="0.35" stroke="#00f5ff" stroke-width="1.5"/>
    <polygon points="32,32 50,22 50,42 32,52" fill="#7928ca" fill-opacity="0.3" stroke="#00f5ff" stroke-width="1.5"/>
  </g>
  <circle cx="32" cy="32" r="3" fill="#ffffff" filter="url(#glow)"/>
</svg>

